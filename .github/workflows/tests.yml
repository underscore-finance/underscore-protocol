name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Local tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETHERSCAN_API_KEY: local-ci-placeholder
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-xdist==3.6.1

      # These files mutate session-scoped contract fixtures, so give each one a
      # fresh pytest process before the parallel remainder.
      - name: Run Undy HQ tests
        run: python -m pytest --fork local tests/registries/test_undy_hq.py -ra

      - name: Run leverage redemption tests
        run: python -m pytest --fork local tests/vaults/leverage/test_levg_redemption_complete.py -ra

      - name: Run remaining local test suite
        run: >
          python -m pytest --fork local
          --ignore=tests/registries/test_undy_hq.py
          --ignore=tests/vaults/leverage/test_levg_redemption_complete.py
          -n auto
          --dist loadfile
          -ra
